name: Switch 2 Metal bring-up app

on:
  workflow_dispatch:
  push:
    branches:
      - switch2-m3-bringup
    paths:
      - "dm/tests/switch2/ios/**"
      - ".github/workflows/switch2-metal-smoke.yml"

jobs:
  build-ios-app:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run payload parser tests
        working-directory: dm/tests/switch2/ios
        run: |
          mkdir -p build
          swiftc Sources/PayloadParser.swift tests/PayloadParserTests.swift -o build/payload-parser-tests
          build/payload-parser-tests

      - name: Generate Xcode project
        working-directory: dm/tests/switch2/ios
        run: xcodegen generate

      - name: Build unsigned iOS app
        working-directory: dm/tests/switch2/ios
        run: |
          xcodebuild \
            -project Switch2Bringup.xcodeproj \
            -scheme Switch2Bringup \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        working-directory: dm/tests/switch2/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/Switch2Bringup.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Switch2Bringup-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Switch2Bringup-unsigned-IPA
          path: dm/tests/switch2/ios/Switch2Bringup-unsigned.ipa
          if-no-files-found: error
